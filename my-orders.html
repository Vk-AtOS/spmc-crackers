<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Orders — Sri Palani Murugan Crackers</title>
<meta name="description" content="Check your order history with Sri Palani Murugan Crackers. Enter your phone number to view all past orders.">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#ffd700;--red-deep:#0d0205;--red-card:#240b0e;--text:#fff5e4;--text-muted:#b08060;--border:rgba(255,215,0,0.18)}
body{background:var(--red-deep);color:var(--text);font-family:'Poppins',sans-serif;min-height:100vh}
nav{padding:0 5%;height:64px;display:flex;align-items:center;justify-content:space-between;background:rgba(7,1,3,0.96);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.nav-logo{font-family:'Cinzel',serif;font-size:16px;font-weight:700;text-decoration:none;background:linear-gradient(135deg,var(--gold),#ff8c00);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-link{color:var(--text-muted);text-decoration:none;font-size:14px}
.nav-link:hover{color:var(--gold)}
.wrap{max-width:560px;margin:0 auto;padding:48px 5% 80px}
h1{font-family:'Cinzel',serif;font-size:clamp(22px,4vw,32px);font-weight:700;background:linear-gradient(135deg,var(--gold),#ff8c00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.subtitle{color:var(--text-muted);font-size:14px;margin-bottom:36px}
.card{background:var(--red-card);border:1px solid var(--border);border-radius:16px;padding:28px;margin-bottom:20px}
.form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.form-label{font-size:13px;color:var(--text-muted);font-weight:500}
.form-input{background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-size:14px;font-family:'Poppins',sans-serif;outline:none;transition:border-color 0.2s;width:100%}
.form-input:focus{border-color:rgba(255,215,0,0.5)}
.form-input::placeholder{color:var(--text-muted)}
.submit-btn{width:100%;background:linear-gradient(135deg,#92400e,#dc7222);color:var(--gold);border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;transition:all 0.3s}
.submit-btn:hover{opacity:0.88}
.submit-btn:disabled{opacity:0.5;cursor:not-allowed}
.error-msg{background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.3);border-radius:10px;padding:12px 16px;color:#f87171;font-size:13px;display:none;margin-bottom:12px}
#results{display:none}
.result-title{font-family:'Cinzel',serif;font-size:17px;font-weight:700;color:var(--gold);margin-bottom:16px}
.order-row{display:flex;justify-content:space-between;align-items:center;padding:14px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,215,0,0.08);border-radius:10px;margin-bottom:10px;text-decoration:none;color:inherit;transition:border-color 0.2s}
.order-row:hover{border-color:rgba(255,215,0,0.3)}
.order-id{font-size:13px;font-weight:700;color:var(--text)}
.order-date{font-size:11px;color:var(--text-muted);margin-top:2px}
.order-right{text-align:right}
.order-total{font-size:14px;font-weight:700;color:var(--gold)}
.order-status{font-size:11px;font-weight:700;border-radius:20px;padding:3px 9px;display:inline-block;margin-top:3px}
.s-pending{background:rgba(251,191,36,0.15);color:#fbbf24}
.s-confirmed{background:rgba(96,165,250,0.15);color:#60a5fa}
.s-dispatched{background:rgba(52,211,153,0.15);color:#34d399}
.s-delivered{background:rgba(134,239,172,0.15);color:#86efac}
.s-cancelled{background:rgba(248,113,113,0.15);color:#f87171}
.s-returned{background:rgba(167,139,250,0.15);color:#a78bfa}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-muted)}
.empty-state span{font-size:40px;display:block;margin-bottom:12px}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo">🎆 Sri Palani Murugan Crackers</a>
  <a href="shop.html" class="nav-link">← Shop</a>
</nav>

<div class="wrap">
  <h1>📋 My Orders</h1>
  <p class="subtitle">Enter your WhatsApp number to view all your orders.</p>

  <div class="card" id="lookup-card">
    <div class="error-msg" id="error-msg"></div>
    <div class="form-group">
      <label class="form-label" for="phone-input">WhatsApp Number</label>
      <input type="tel" id="phone-input" class="form-input" placeholder="10-digit mobile number" autocomplete="tel">
    </div>
    <button class="submit-btn" id="lookup-btn">View My Orders</button>
  </div>

  <div id="results"></div>
</div>

<script src="js/config.js"></script>
<script>
document.getElementById('lookup-btn').addEventListener('click', lookupOrders);
document.getElementById('phone-input').addEventListener('keydown', e => { if (e.key === 'Enter') lookupOrders(); });

// Pre-fill from URL or sessionStorage
const urlPhone = new URLSearchParams(location.search).get('phone');
const ssPhone = sessionStorage.getItem('spmc_customer') ? JSON.parse(sessionStorage.getItem('spmc_customer') || '{}').phone : null;
if (urlPhone || ssPhone) document.getElementById('phone-input').value = urlPhone || ssPhone || '';

async function lookupOrders() {
  const phone = document.getElementById('phone-input').value.trim();
  const errEl = document.getElementById('error-msg');
  errEl.style.display = 'none';

  if (!phone) {
    errEl.textContent = 'Please enter your phone number.';
    errEl.style.display = 'block';
    return;
  }

  const btn = document.getElementById('lookup-btn');
  btn.disabled = true; btn.textContent = 'Loading...';

  try {
    const r = await fetch(window.SPMC_API + '/my-orders?phone=' + encodeURIComponent(phone));
    const data = await r.json();
    if (!r.ok) {
      errEl.textContent = data.error || 'Could not load orders.';
      errEl.style.display = 'block';
      return;
    }
    renderResults(data, phone);
  } catch {
    errEl.textContent = 'Could not connect. Please try again.';
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = 'View My Orders';
  }
}

function renderResults(orders, phone) {
  const results = document.getElementById('results');
  results.textContent = '';
  results.style.display = 'block';

  const title = document.createElement('div');
  title.className = 'result-title';
  title.textContent = orders.length + ' Order' + (orders.length !== 1 ? 's' : '') + ' Found';
  results.appendChild(title);

  if (orders.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    const icon = document.createElement('span'); icon.textContent = '📦';
    const msg = document.createElement('p'); msg.textContent = 'No orders found for this number.';
    empty.append(icon, msg);
    results.appendChild(empty);
    return;
  }

  const STATUS_LABELS = { pending: 'Pending', confirmed: 'Confirmed', dispatched: 'Dispatched', delivered: 'Delivered', cancelled: 'Cancelled', returned: 'Returned' };

  orders.forEach(order => {
    const row = document.createElement('a');
    row.className = 'order-row';
    row.href = 'order-status.html?id=' + encodeURIComponent(order.orderId) + '&phone=' + encodeURIComponent(phone);

    const left = document.createElement('div');
    const idEl = document.createElement('div'); idEl.className = 'order-id'; idEl.textContent = order.orderId;
    const dateEl = document.createElement('div'); dateEl.className = 'order-date';
    dateEl.textContent = order.createdAt ? new Date(order.createdAt).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
    left.append(idEl, dateEl);

    const right = document.createElement('div'); right.className = 'order-right';
    const totalEl = document.createElement('div'); totalEl.className = 'order-total';
    totalEl.textContent = '₹' + (order.total || 0).toLocaleString('en-IN');
    const statusEl = document.createElement('span');
    statusEl.className = 'order-status s-' + (order.status || 'pending');
    statusEl.textContent = STATUS_LABELS[order.status] || order.status;
    right.append(totalEl, statusEl);

    row.append(left, right);
    results.appendChild(row);
  });

  results.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// Auto-lookup if phone pre-filled
if (document.getElementById('phone-input').value) lookupOrders();
</script>
</body>
</html>
