<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Track Your Order — Sri Palani Murugan Crackers</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#ffd700;--red-deep:#0d0205;--red-card:#240b0e;--text:#fff5e4;--text-muted:#b08060;--border:rgba(255,215,0,0.18)}
body{background:var(--red-deep);color:var(--text);font-family:'Poppins',sans-serif;min-height:100vh}
nav{padding:0 5%;height:64px;display:flex;align-items:center;justify-content:space-between;background:rgba(7,1,3,0.96);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.nav-logo{font-family:'Cinzel',serif;font-size:16px;font-weight:700;text-decoration:none;background:linear-gradient(135deg,var(--gold),#ff8c00);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-link{color:var(--text-muted);text-decoration:none;font-size:14px}
.nav-link:hover{color:var(--gold)}
.wrap{max-width:560px;margin:0 auto;padding:48px 5% 80px}
h1{font-family:'Cinzel',serif;font-size:clamp(22px,4vw,32px);font-weight:700;background:linear-gradient(135deg,var(--gold),#ff8c00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.subtitle{color:var(--text-muted);font-size:14px;margin-bottom:36px}
.card{background:var(--red-card);border:1px solid var(--border);border-radius:16px;padding:28px;margin-bottom:20px}
.form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.form-label{font-size:13px;color:var(--text-muted);font-weight:500}
.form-input{background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-size:14px;font-family:'Poppins',sans-serif;outline:none;transition:border-color 0.2s;width:100%}
.form-input:focus{border-color:rgba(255,215,0,0.5)}
.form-input::placeholder{color:var(--text-muted)}
.submit-btn{width:100%;background:linear-gradient(135deg,#92400e,#dc7222);color:var(--gold);border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;transition:all 0.3s}
.submit-btn:hover{opacity:0.88}
.submit-btn:disabled{opacity:0.5;cursor:not-allowed}
.error-msg{background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.3);border-radius:10px;padding:12px 16px;color:#f87171;font-size:13px;display:none;margin-bottom:12px}
#result{display:none}
.status-header{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.status-icon{font-size:36px}
.status-title{font-family:'Cinzel',serif;font-size:18px;font-weight:700;color:var(--gold)}
.status-sub{font-size:12px;color:var(--text-muted);margin-top:2px;margin-bottom:8px}
.badge{display:inline-flex;align-items:center;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700}
.s-pending{background:rgba(251,191,36,0.15);color:#fbbf24;border:1px solid rgba(251,191,36,0.3)}
.s-confirmed{background:rgba(96,165,250,0.15);color:#60a5fa;border:1px solid rgba(96,165,250,0.3)}
.s-dispatched{background:rgba(52,211,153,0.15);color:#34d399;border:1px solid rgba(52,211,153,0.3)}
.s-delivered{background:rgba(134,239,172,0.15);color:#86efac;border:1px solid rgba(134,239,172,0.3)}
.s-cancelled{background:rgba(248,113,113,0.15);color:#f87171;border:1px solid rgba(248,113,113,0.3)}
.s-returned{background:rgba(167,139,250,0.15);color:#a78bfa;border:1px solid rgba(167,139,250,0.3)}
.detail-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,215,0,0.06);font-size:14px}
.detail-row:last-child{border-bottom:none}
.detail-label{color:var(--text-muted)}
.detail-val{color:var(--text);font-weight:500;text-align:right;max-width:60%}
.items-title{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin:16px 0 10px}
.item-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid rgba(255,215,0,0.04)}
.item-row:last-child{border-bottom:none}
.tracking-box{background:rgba(52,211,153,0.06);border:1px solid rgba(52,211,153,0.2);border-radius:10px;padding:14px;margin-top:16px}
.tracking-label{font-size:11px;color:#34d399;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.tracking-num{font-size:15px;font-weight:700;color:#fff}
.steps{display:flex;flex-direction:column;gap:0;margin:20px 0}
.step{display:flex;gap:14px;align-items:flex-start;padding-bottom:20px;position:relative}
.step:last-child{padding-bottom:0}
.step-line{position:absolute;left:15px;top:32px;width:2px;background:var(--border);bottom:0}
.step:last-child .step-line{display:none}
.step-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;border:2px solid var(--border);background:var(--red-deep);position:relative;z-index:1}
.step-dot.done{background:linear-gradient(135deg,#92400e,#dc7222);border-color:var(--gold)}
.step-dot.active{background:rgba(255,215,0,0.1);border-color:var(--gold);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,215,0,0.3)}50%{box-shadow:0 0 0 6px rgba(255,215,0,0)}}
.step-info{padding-top:4px}
.step-name{font-size:14px;font-weight:600;color:var(--text)}
.step-name.muted{color:var(--text-muted)}
.step-desc{font-size:12px;color:var(--text-muted);margin-top:2px}
.wa-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:#25d366;color:#fff;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;margin-top:16px;transition:all 0.2s}
.wa-btn:hover{opacity:0.88}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo">🎆 Sri Palani Murugan Crackers</a>
  <a href="shop.html" class="nav-link">← Back to Shop</a>
</nav>

<div class="wrap">
  <h1>📦 Track Your Order</h1>
  <p class="subtitle">Enter your Order ID and WhatsApp number to check status.</p>

  <div class="card" id="lookup-card">
    <div class="error-msg" id="error-msg"></div>
    <div class="form-group">
      <label class="form-label" for="order-id-input">Order ID</label>
      <input type="text" id="order-id-input" class="form-input" placeholder="e.g. SPMC12345678" autocomplete="off" spellcheck="false">
    </div>
    <div class="form-group">
      <label class="form-label" for="phone-input">WhatsApp Number</label>
      <input type="tel" id="phone-input" class="form-input" placeholder="10-digit mobile number" autocomplete="tel">
    </div>
    <button class="submit-btn" id="track-btn">Track Order</button>
  </div>

  <div class="card" id="result"></div>
</div>

<script src="js/config.js"></script>
<script>
const STATUS_META = {
  pending:    { icon: '⏳', label: 'Order Pending',   desc: 'Your order has been received and is awaiting confirmation.' },
  confirmed:  { icon: '✅', label: 'Order Confirmed', desc: 'Your order is confirmed and being prepared for dispatch.' },
  dispatched: { icon: '🚚', label: 'Dispatched',      desc: 'Your order is on the way from Sivakasi.' },
  delivered:  { icon: '🎆', label: 'Delivered',       desc: 'Your order has been delivered. Enjoy the celebrations!' },
  cancelled:  { icon: '❌', label: 'Cancelled',       desc: 'This order has been cancelled. Contact us on WhatsApp for help.' },
  returned:   { icon: '↩',  label: 'Returned',        desc: 'This order has been returned.' },
};
const ORDER_STEPS = ['pending', 'confirmed', 'dispatched', 'delivered'];

const urlParams = new URLSearchParams(location.search);
if (urlParams.get('id'))    document.getElementById('order-id-input').value = urlParams.get('id');
if (urlParams.get('phone')) document.getElementById('phone-input').value = urlParams.get('phone');

document.getElementById('track-btn').addEventListener('click', trackOrder);
document.getElementById('phone-input').addEventListener('keydown', e => { if (e.key === 'Enter') trackOrder(); });

async function trackOrder() {
  const orderId = document.getElementById('order-id-input').value.trim().toUpperCase();
  const phone   = document.getElementById('phone-input').value.trim();
  const errEl   = document.getElementById('error-msg');
  errEl.style.display = 'none';

  if (!orderId || !phone) {
    errEl.textContent = 'Please enter both your Order ID and phone number.';
    errEl.style.display = 'block';
    return;
  }

  const btn = document.getElementById('track-btn');
  btn.disabled = true;
  btn.textContent = 'Checking...';

  try {
    const r = await fetch(window.SPMC_API + '/order-status/' + encodeURIComponent(orderId) + '?phone=' + encodeURIComponent(phone));
    const data = await r.json();
    if (!r.ok) {
      errEl.textContent = data.error || 'Order not found. Check your Order ID and phone number.';
      errEl.style.display = 'block';
      return;
    }
    renderResult(data);
  } catch {
    errEl.textContent = 'Could not connect. Please try again.';
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Track Order';
  }
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function renderResult(order) {
  const result = document.getElementById('result');
  result.textContent = '';
  result.style.display = 'block';

  const meta = STATUS_META[order.status] || STATUS_META.pending;
  const isCancelled = order.status === 'cancelled' || order.status === 'returned';

  // Status header
  const header = el('div', 'status-header');
  const icon = el('div', 'status-icon', meta.icon);
  const info = el('div');
  info.append(
    el('div', 'status-title', meta.label),
    el('div', 'status-sub', meta.desc),
    Object.assign(el('span', 'badge s-' + order.status), {
      textContent: order.status.charAt(0).toUpperCase() + order.status.slice(1),
    })
  );
  header.append(icon, info);
  result.appendChild(header);

  // Progress steps
  if (!isCancelled) {
    const steps = el('div', 'steps');
    const currentIdx = ORDER_STEPS.indexOf(order.status);
    ORDER_STEPS.forEach((step, i) => {
      const stepEl = el('div', 'step');
      const line = el('div', 'step-line');
      const dotCls = 'step-dot' + (i < currentIdx ? ' done' : i === currentIdx ? ' active' : '');
      const dot = el('div', dotCls, i < currentIdx ? '✓' : String(i + 1));
      const stepInfo = el('div', 'step-info');
      stepInfo.append(
        el('div', 'step-name' + (i > currentIdx ? ' muted' : ''), STATUS_META[step].label),
        el('div', 'step-desc', STATUS_META[step].desc)
      );
      stepEl.append(line, dot, stepInfo);
      steps.appendChild(stepEl);
    });
    result.appendChild(steps);
  }

  // Tracking number
  if (order.tracking) {
    const box = el('div', 'tracking-box');
    box.append(el('div', 'tracking-label', 'Tracking Number'), el('div', 'tracking-num', order.tracking));
    result.appendChild(box);
  }

  // Order details
  const detailsWrap = el('div');
  detailsWrap.style.marginTop = '20px';
  [
    ['Order ID', order.orderId],
    ['Payment', order.paymentStatus === 'paid' ? '✅ Paid' : '⏳ Pending'],
    ['Total', '₹' + (order.total || 0).toLocaleString('en-IN')],
    ['Ordered on', order.createdAt ? new Date(order.createdAt).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '—'],
  ].forEach(([label, val]) => {
    const row = el('div', 'detail-row');
    row.append(el('span', 'detail-label', label), el('span', 'detail-val', val));
    detailsWrap.appendChild(row);
  });
  result.appendChild(detailsWrap);

  // Items
  if (order.items && order.items.length) {
    result.appendChild(el('div', 'items-title', 'Items Ordered'));
    order.items.forEach(item => {
      const row = el('div', 'item-row');
      const qty = el('span');
      qty.style.color = 'var(--text-muted)';
      qty.textContent = '× ' + item.qty;
      row.append(el('span', null, item.name), qty);
      result.appendChild(row);
    });
  }

  // WhatsApp help
  const waBtn = el('a', 'wa-btn');
  waBtn.href = 'https://wa.me/' + (window.SPMC_WA_PHONE || '917200915142') + '?text=' + encodeURIComponent('Hi, I need help with my order ' + order.orderId);
  waBtn.target = '_blank';
  waBtn.rel = 'noopener';
  waBtn.append(el('span', null, '💬'), el('span', null, 'Need help? Chat on WhatsApp'));
  result.appendChild(waBtn);

  result.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

if (urlParams.get('id') && urlParams.get('phone')) trackOrder();
</script>
</body>
</html>
