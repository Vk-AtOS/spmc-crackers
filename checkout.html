<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout — Sri Palani Murugan Crackers</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+Tamil:wght@400;600&display=swap" rel="stylesheet">
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#ffd700;--red-deep:#0d0205;--red-card:#240b0e;--red-mid:#1a0508;
  --text:#fff5e4;--text-muted:#b08060;--border:rgba(255,215,0,0.18);
}
body{background:var(--red-deep);color:var(--text);font-family:'Poppins',sans-serif;min-height:100vh}
nav{
  padding:0 5%;height:64px;display:flex;align-items:center;justify-content:space-between;
  background:rgba(7,1,3,0.96);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:100;
}
.nav-logo{font-family:'Cinzel',serif;font-size:16px;font-weight:700;text-decoration:none;
  background:linear-gradient(135deg,var(--gold),#ff8c00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.nav-back{color:var(--text-muted);text-decoration:none;font-size:14px}
.nav-back:hover{color:var(--gold)}

.checkout-wrap{max-width:880px;margin:0 auto;padding:40px 5% 80px}
.page-title{font-family:'Cinzel',serif;font-size:clamp(22px,4vw,34px);font-weight:700;
  background:linear-gradient(135deg,var(--gold),#ff8c00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  margin-bottom:32px;}

.checkout-layout{display:grid;gap:24px;grid-template-columns:1fr 320px;align-items:start}

.checkout-form{background:var(--red-card);border:1px solid var(--border);border-radius:16px;padding:28px}
.form-section-title{font-size:16px;font-weight:600;color:var(--gold);margin-bottom:18px;
  padding-bottom:10px;border-bottom:1px solid var(--border);}
.form-grid{display:grid;gap:14px;grid-template-columns:1fr 1fr}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group.full{grid-column:1/-1}
.form-label{font-size:13px;color:var(--text-muted);font-weight:500}
.form-input,.form-select,.form-textarea{
  background:rgba(255,255,255,0.05);border:1px solid var(--border);
  border-radius:10px;padding:11px 14px;color:var(--text);font-size:14px;
  font-family:'Poppins',sans-serif;outline:none;transition:border-color 0.2s;width:100%;
}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:rgba(255,215,0,0.5)}
.form-input::placeholder{color:var(--text-muted)}
.form-select option{background:#1a0508}
.form-textarea{resize:vertical;min-height:80px}

.payment-options{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.payment-option{
  display:flex;align-items:center;gap:12px;
  background:rgba(255,255,255,0.03);border:1px solid var(--border);
  border-radius:10px;padding:12px 16px;cursor:pointer;transition:all 0.2s;
}
.payment-option:hover{border-color:rgba(255,215,0,0.35)}
.payment-option input[type=radio]{accent-color:var(--gold);width:18px;height:18px;cursor:pointer}
.payment-option label{cursor:pointer;flex:1}
.payment-option-title{font-size:14px;font-weight:600;color:var(--text)}
.payment-option-sub{font-size:12px;color:var(--text-muted);margin-top:2px}
.payment-option.selected{border-color:rgba(255,215,0,0.5);background:rgba(255,215,0,0.05)}

.safety-notice{
  background:rgba(255,165,0,0.06);border:1px solid rgba(255,165,0,0.2);
  border-radius:10px;padding:14px;margin-top:18px;
  font-size:12px;color:rgba(255,165,0,0.8);line-height:1.6;
}

.order-review{background:var(--red-card);border:1px solid var(--border);border-radius:16px;padding:24px;position:sticky;top:80px}
.review-title{font-family:'Cinzel',serif;font-size:16px;font-weight:600;color:var(--gold);margin-bottom:16px}
.review-items{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.review-item{display:flex;align-items:center;gap:10px}
.review-item-thumb{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.review-item-name{font-size:13px;color:var(--text);flex:1;line-height:1.3}
.review-item-sub{font-size:11px;color:var(--text-muted)}
.review-item-price{font-size:13px;font-weight:600;color:var(--gold);flex-shrink:0}
.review-total-row{display:flex;justify-content:space-between;padding:10px 0;font-size:14px;border-top:1px solid var(--border)}
.review-total-label{color:var(--text-muted)}
.review-total-val{color:var(--text);font-weight:600}
.review-grand{display:flex;justify-content:space-between;padding:12px 0 0;font-size:17px;font-weight:700;color:var(--gold);border-top:1px solid var(--border);margin-top:4px}

.submit-btn{
  width:100%;background:linear-gradient(135deg,#25d366,#128c50);color:white;
  border:none;border-radius:12px;padding:15px;font-size:15px;font-weight:700;
  cursor:pointer;margin-top:18px;display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 4px 20px rgba(37,211,102,0.35);transition:all 0.3s;
}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(37,211,102,0.5)}

.trust-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.trust-chip{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:11px;color:var(--text-muted)}

.form-input.error{border-color:#ef4444}
.form-error{font-size:11px;color:#ef4444;margin-top:2px}

@media(max-width:720px){.checkout-layout{grid-template-columns:1fr}.order-review{position:static}.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo">🎆 Sri Palani Murugan Crackers</a>
  <a href="cart.html" class="nav-back">← Back to Cart</a>
</nav>

<div class="checkout-wrap">
  <h1 class="page-title">📋 Checkout</h1>
  <div id="checkout-root"></div>
</div>

<script src="js/products.js"></script>
<script src="js/i18n.js"></script>
<script src="js/cart.js"></script>
<script src="js/support.js"></script>
<script>
const items = Cart.get();
if (items.length === 0) window.location.href = 'shop.html';

const root = document.getElementById('checkout-root');
const layout = document.createElement('div');
layout.className = 'checkout-layout';

// ── FORM ─────────────────────────────────────────────────
const formSection = document.createElement('div');
formSection.className = 'checkout-form';

const formT = document.createElement('div');
formT.className = 'form-section-title';
formT.textContent = '📦 Delivery Details';
formSection.appendChild(formT);

const formEl = document.createElement('form');
formEl.id = 'checkout-form';
formEl.noValidate = true;

const formGrid = document.createElement('div');
formGrid.className = 'form-grid';

const fieldDefs = [
  { id: 'name', label: 'Full Name *', placeholder: 'Enter your full name', type: 'text', full: false, ac: 'name' },
  { id: 'phone', label: 'WhatsApp Number *', placeholder: '+91 98765 43210', type: 'tel', full: false, ac: 'tel' },
  { id: 'address', label: 'Street Address *', placeholder: 'House/Flat No, Street Name', type: 'text', full: true, ac: 'street-address' },
  { id: 'city', label: 'City *', placeholder: 'Your city', type: 'text', full: false, ac: 'address-level2' },
  { id: 'state', label: 'State *', placeholder: 'State', type: 'text', full: false, ac: 'address-level1' },
  { id: 'pincode', label: 'Pincode *', placeholder: '6 digit pincode', type: 'text', full: false, ac: 'postal-code' },
];

fieldDefs.forEach(f => {
  const group = document.createElement('div');
  group.className = 'form-group' + (f.full ? ' full' : '');
  const label = document.createElement('label');
  label.className = 'form-label';
  label.htmlFor = f.id;
  label.textContent = f.label;
  const input = document.createElement('input');
  input.type = f.type;
  input.id = f.id;
  input.className = 'form-input';
  input.placeholder = f.placeholder;
  input.autocomplete = f.ac;
  group.append(label, input);
  formGrid.appendChild(group);
});

const notesGroup = document.createElement('div');
notesGroup.className = 'form-group full';
const notesLabel = document.createElement('label');
notesLabel.className = 'form-label';
notesLabel.htmlFor = 'notes';
notesLabel.textContent = 'Special Instructions (optional)';
const notesTA = document.createElement('textarea');
notesTA.id = 'notes';
notesTA.className = 'form-textarea';
notesTA.placeholder = 'Any special instructions for delivery or packing...';
notesGroup.append(notesLabel, notesTA);
formGrid.appendChild(notesGroup);

formEl.appendChild(formGrid);

const payTitle = document.createElement('div');
payTitle.className = 'form-section-title';
payTitle.style.marginTop = '24px';
payTitle.textContent = '💳 Payment Method';
formEl.appendChild(payTitle);

const payOptions = document.createElement('div');
payOptions.className = 'payment-options';

[
  { id: 'whatsapp-confirm', title: '💬 Pay on WhatsApp Confirmation', sub: "We'll confirm your order and send UPI payment link via WhatsApp" },
  { id: 'razorpay', title: '💳 Pay Now — UPI / Card / NetBanking', sub: 'Instant payment via Razorpay. Order confirmed immediately.' },
  { id: 'cod', title: '💵 Cash on Delivery', sub: 'Available in select Tamil Nadu areas only' },
].forEach((pay, i) => {
  const opt = document.createElement('div');
  opt.className = 'payment-option' + (i === 0 ? ' selected' : '');
  const radio = document.createElement('input');
  radio.type = 'radio';
  radio.name = 'payment';
  radio.id = 'pay-' + pay.id;
  radio.value = pay.title;
  radio.checked = i === 0;
  const lbl = document.createElement('label');
  lbl.htmlFor = 'pay-' + pay.id;
  const ptitle = document.createElement('div');
  ptitle.className = 'payment-option-title';
  ptitle.textContent = pay.title;
  const psub = document.createElement('div');
  psub.className = 'payment-option-sub';
  psub.textContent = pay.sub;
  lbl.append(ptitle, psub);
  opt.append(radio, lbl);
  opt.addEventListener('click', () => {
    document.querySelectorAll('.payment-option').forEach(o => o.classList.remove('selected'));
    opt.classList.add('selected');
    radio.checked = true;
  });
  payOptions.appendChild(opt);
});

formEl.appendChild(payOptions);

const safetyDiv = document.createElement('div');
safetyDiv.className = 'safety-notice';
safetyDiv.textContent = '⚠️ Important: Crackers are for outdoor use only. Adult supervision required. Keep away from children under 15. Follow all safety instructions on packaging.';
formEl.appendChild(safetyDiv);

formSection.appendChild(formEl);

// ── ORDER REVIEW ─────────────────────────────────────────
const review = document.createElement('div');
review.className = 'order-review';

const revTitle = document.createElement('div');
revTitle.className = 'review-title';
revTitle.textContent = '🛒 Order Summary';

const revItems = document.createElement('div');
revItems.className = 'review-items';

let subtotal = 0, savings = 0;
items.forEach(item => {
  const p = getProduct(item.id);
  if (!p) return;
  subtotal += p.price * item.qty;
  if (!p.noDiscount) savings += (p.mrp - p.price) * item.qty;

  const row = document.createElement('div');
  row.className = 'review-item';
  const bg = CATEGORY_COLORS[p.cat] || '#240b0e';
  const thumb = document.createElement('div');
  thumb.className = 'review-item-thumb';
  thumb.style.background = `linear-gradient(160deg,${bg}cc,#0d0205)`;
  thumb.textContent = p.emoji;
  const info = document.createElement('div');
  info.style.flex = '1';
  const rname = document.createElement('div');
  rname.className = 'review-item-name';
  rname.textContent = p.name;
  const rsub = document.createElement('div');
  rsub.className = 'review-item-sub';
  rsub.textContent = '× ' + item.qty + ' ' + p.unit;
  info.append(rname, rsub);
  const rprice = document.createElement('div');
  rprice.className = 'review-item-price';
  rprice.textContent = '₹' + (p.price * item.qty).toLocaleString('en-IN');
  row.append(thumb, info, rprice);
  revItems.appendChild(row);
});

const shipRow = document.createElement('div');
shipRow.className = 'review-total-row';
const sl = document.createElement('span');
sl.className = 'review-total-label';
sl.textContent = 'Shipping';
const sv = document.createElement('span');
sv.className = 'review-total-val';
sv.textContent = 'To be confirmed';
shipRow.append(sl, sv);

const grand = document.createElement('div');
grand.className = 'review-grand';
const gl = document.createElement('span');
gl.textContent = 'Total';
const gv = document.createElement('span');
gv.textContent = '₹' + subtotal.toLocaleString('en-IN');
grand.append(gl, gv);

const savBadge = document.createElement('div');
savBadge.style.cssText = 'background:rgba(134,239,172,0.1);border:1px solid rgba(134,239,172,0.2);border-radius:10px;padding:10px;text-align:center;font-size:12px;color:#86efac;font-weight:600;margin-top:12px;';
savBadge.textContent = '🎉 You save ₹' + savings.toLocaleString('en-IN') + ' with 50% discount!';

const submitBtn = document.createElement('button');
submitBtn.type = 'button';
submitBtn.className = 'submit-btn';
const btnIcon = document.createElement('span');
btnIcon.textContent = '💬';
const btnText = document.createElement('span');
btnText.textContent = 'Place Order on WhatsApp';
submitBtn.append(btnIcon, btnText);

const trustChips = document.createElement('div');
trustChips.className = 'trust-chips';
['🔒 Secure', '✅ Genuine', '🚚 Fast Delivery', '💬 WhatsApp Support'].forEach(chip => {
  const c = document.createElement('span');
  c.className = 'trust-chip';
  c.textContent = chip;
  trustChips.appendChild(c);
});

review.append(revTitle, revItems, shipRow, grand, savBadge, submitBtn, trustChips);
layout.append(formSection, review);
root.appendChild(layout);

// ── SUBMIT ───────────────────────────────────────────────
const BACKEND = 'http://localhost:3001';

function validateForm() {
  const val = id => document.getElementById(id)?.value.trim() || '';
  document.querySelectorAll('.form-error').forEach(e => e.remove());
  document.querySelectorAll('.form-input.error').forEach(e => e.classList.remove('error'));

  let valid = true;
  ['name','phone','address','city','state','pincode'].forEach(id => {
    const input = document.getElementById(id);
    if (!input?.value.trim()) {
      valid = false;
      input?.classList.add('error');
      const err = document.createElement('div');
      err.className = 'form-error';
      err.textContent = 'This field is required';
      input?.parentNode.appendChild(err);
    }
  });
  if (!/^\+?[\d\s\-]{10,15}$/.test(val('phone'))) {
    const inp = document.getElementById('phone');
    inp?.classList.add('error');
    const err = document.createElement('div');
    err.className = 'form-error';
    err.textContent = 'Enter a valid phone number';
    inp?.parentNode.appendChild(err);
    valid = false;
  }
  if (!/^\d{6}$/.test(val('pincode'))) {
    const inp = document.getElementById('pincode');
    inp?.classList.add('error');
    const err = document.createElement('div');
    err.className = 'form-error';
    err.textContent = 'Enter a valid 6-digit pincode';
    inp?.parentNode.appendChild(err);
    valid = false;
  }
  if (!valid) document.querySelector('.form-input.error')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  return valid;
}

function getCustomerInfo() {
  const val = id => document.getElementById(id)?.value.trim() || '';
  return {
    name: val('name'), phone: val('phone'), address: val('address'),
    city: val('city'), state: val('state'), pincode: val('pincode'),
    payment: document.querySelector('input[name="payment"]:checked')?.value || 'WhatsApp Confirmation',
    notes: val('notes'),
  };
}

function saveToBackend(orderId, customerInfo, paymentId, paymentStatus) {
  fetch(BACKEND + '/orders', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      orderId, customer: customerInfo,
      items: Cart.get().map(i => {
        const p = getProduct(i.id);
        return { id: i.id, name: p?.name, qty: i.qty, price: p?.price };
      }),
      total: subtotal, createdAt: new Date().toISOString(),
      paymentId: paymentId || null,
      paymentStatus: paymentStatus || 'pending',
    }),
  }).catch(() => {});
}

function finishOrder(orderId, customerInfo) {
  sessionStorage.setItem('spmc_order_id', orderId);
  sessionStorage.setItem('spmc_customer', JSON.stringify(customerInfo));
  sessionStorage.setItem('spmc_order_total', subtotal);
  Cart.clear();
  window.location.href = 'order-success.html';
}

submitBtn.addEventListener('click', async () => {
  if (!validateForm()) return;
  const customerInfo = getCustomerInfo();
  const orderId = 'SPMC' + Date.now().toString().slice(-8);
  const paymentMethod = document.querySelector('input[name="payment"]:checked')?.id || '';

  if (paymentMethod === 'pay-razorpay') {
    // ── RAZORPAY FLOW ─────────────────────────────────────
    submitBtn.disabled = true;
    const btnText = submitBtn.querySelector('span:last-child');
    if (btnText) btnText.textContent = 'Initialising payment...';

    let rzpOrderId;
    try {
      const cfgRes = await fetch(BACKEND + '/config');
      const cfg = cfgRes.ok ? await cfgRes.json() : {};
      if (!cfg.razorpayEnabled) throw new Error('razorpay_disabled');

      const r = await fetch(BACKEND + '/create-razorpay-order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ amount: subtotal, orderId }),
      });
      if (!r.ok) throw new Error('order_create_failed');
      const data = await r.json();
      rzpOrderId = data.id;

      const rzp = new Razorpay({
        key: cfg.razorpayKeyId,
        amount: data.amount,
        currency: data.currency,
        name: 'Sri Palani Murugan Crackers',
        description: 'Diwali Crackers — ' + orderId,
        order_id: rzpOrderId,
        prefill: { name: customerInfo.name, contact: customerInfo.phone },
        theme: { color: '#ffd700' },
        handler: async function(response) {
          // Verify signature
          try {
            await fetch(BACKEND + '/verify-payment', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                razorpay_order_id: response.razorpay_order_id,
                razorpay_payment_id: response.razorpay_payment_id,
                razorpay_signature: response.razorpay_signature,
                orderId,
              }),
            });
          } catch {}
          saveToBackend(orderId, customerInfo, response.razorpay_payment_id, 'paid');
          finishOrder(orderId, customerInfo);
        },
        modal: {
          ondismiss: () => {
            submitBtn.disabled = false;
            if (btnText) btnText.textContent = 'Pay Now — UPI / Card / NetBanking';
          },
        },
      });
      rzp.open();
    } catch (err) {
      submitBtn.disabled = false;
      if (btnText) btnText.textContent = 'Pay Now — UPI / Card / NetBanking';
      if (err.message === 'razorpay_disabled') {
        alert('Online payment is not enabled yet. Please select "Pay on WhatsApp Confirmation" to place your order.');
      } else {
        alert('Payment setup failed. Please try WhatsApp ordering instead.');
      }
    }
    return;
  }

  // ── WHATSAPP / COD FLOW ───────────────────────────────
  saveToBackend(orderId, customerInfo, null, 'pending');
  const waMsg = Cart.toWhatsApp(customerInfo);
  sessionStorage.setItem('spmc_order_id', orderId);
  sessionStorage.setItem('spmc_customer', JSON.stringify(customerInfo));
  sessionStorage.setItem('spmc_order_total', subtotal);
  Cart.clear();
  window.open('https://wa.me/917200915142?text=' + waMsg, '_blank');
  window.location.href = 'order-success.html';
});
</script>
</body>
</html>
